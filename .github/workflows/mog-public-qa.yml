name: MOG public visual QA (zero-cost standard runner)
on:
  push:
    branches:
      - mog-qa-public-20261029
    paths:
      - .github/workflows/mog-public-qa.yml
      - tools/mog-qa.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mog-public-visual-qa
  cancel-in-progress: true
jobs:
  responsive-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout dedicated QA branch
        uses: actions/checkout@v4
      - name: Install Node.js (standard runner only)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright locally
        run: npm install --no-save playwright
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run all 30 public destinations at 3 sizes
        run: node tools/mog-qa.mjs
      - name: Save results on the isolated QA branch
        if: always()
        shell: bash
        run: |
          if [ -f mog-qa-reports/summary.json ]; then
            git config user.name "MOG QA Bot"
            git config user.email "mog-qa-bot@users.noreply.github.com"
            git add -f mog-qa-reports/
            if ! git diff --cached --quiet; then
              git commit -m "Store public MOG QA report"
              git fetch origin mog-qa-public-20261029
              git rebase origin/mog-qa-public-20261029
              git push origin HEAD:mog-qa-public-20261029
            fi
          fi
