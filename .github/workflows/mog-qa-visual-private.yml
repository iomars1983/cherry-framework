name: MOG QA private visual inspection
on:
  push:
    branches: [mog-qa-public-20261029]
    paths:
      - .github/workflows/mog-qa-visual-private.yml
      - tools/mog-qa-visual-private.mjs
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Configure scoped viewport evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/mog-qa-visual-private.mjs')
          s=p.read_text()
          old="const panels=[['fidelity','fidelity-manager'],['red','wpmntz-import-listino-RED'],['um','wpmntz-import-listino-UM']];"
          assert old in s
          s=s.replace(old,"const panels=[['fidelity','fidelity-manager']];")
          publisher=r'''async function publishRequest(file){
            const api='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file;
            const headers={Authorization:'Bearer '+process.env.QA_GITHUB_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
            const r=await fetch(api+'?ref='+encodeURIComponent(branch),{headers});
            if(r.status!==200&&r.status!==404)throw Error('REQUEST_LOOKUP_'+r.status);
            const old=r.status===200?await r.json():{};
            const data={message:'Publish MOG QA read-only request identifier',content:(await readFile(file)).toString('base64'),branch};
            if(old.sha)data.sha=old.sha;
            const put=await fetch(api,{method:'PUT',headers,body:JSON.stringify(data)});
            if(!put.ok)throw Error('REQUEST_PUBLICATION_'+put.status);
          }'''
          s,n=re.subn(r'function publishRequest\(file\)\{.*?\n\}',lambda m:publisher,s,count=1,flags=re.S)
          assert n==1
          s=s.replace('publishRequest(requestFile);','await publishRequest(requestFile);')
          s=s.replace("if(res.status()!==200||!/^[a-f0-9]{32}$/.test(id))", "console.log('MOG_VISUAL_PAIR_HTTP '+res.status());if(res.status()!==200||!/^[a-f0-9]{32}$/.test(id))")
          needle="await capture(page,name+'-'+width+'-initial');"
          assert needle in s
          addon=r'''
              if(name==='fidelity'){
                row.scrollAncestors=await page.evaluate(()=>{
                  const a=[];let e=document.querySelector('#fm-table-container');
                  while(e){const r=e.getBoundingClientRect(),s=getComputedStyle(e);a.push({id:e.id,cls:e.className,client:e.clientHeight,scroll:e.scrollHeight,overflow:s.overflowY,top:r.top,height:r.height});e=e.parentElement;}return a;
                });
                await page.evaluate(()=>{const t=document.querySelector('#fm-table-container');t.scrollLeft=0;t.scrollIntoView({block:'start',inline:'nearest'});});
                await page.waitForTimeout(450);
                for(const position of ['left','right']){
                  await page.evaluate(pos=>{const t=document.querySelector('#fm-table-container');t.scrollLeft=pos==='left'?0:t.scrollWidth;},position);
                  await page.waitForTimeout(250);
                  const b=await page.screenshot({type:'jpeg',quality:90,fullPage:false,animations:'disabled'});
                  files.push({name:name+'-'+width+'-viewport-head-'+position+'.jpg',data:b.toString('base64')});
                }
                for(const fraction of [0.35,0.7,1]){
                  await page.evaluate(f=>{
                    const t=document.querySelector('#fm-table-container');t.scrollLeft=0;
                    for(let e=t.parentElement;e;e=e.parentElement){const s=getComputedStyle(e);if(e.scrollHeight>e.clientHeight+10&&['auto','scroll'].includes(s.overflowY)){e.scrollTop=(e.scrollHeight-e.clientHeight)*f;return;}}
                    window.scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*f);
                  },fraction);
                  await page.waitForTimeout(300);
                  const b=await page.screenshot({type:'jpeg',quality:90,fullPage:false,animations:'disabled'});
                  files.push({name:name+'-'+width+'-viewport-scroll-'+String(fraction).replace('.','-')+'.jpg',data:b.toString('base64')});
                }
              }
          '''
          s=s.replace(needle,needle+addon)
          s=s.replace("run().catch(()=>{console.log('MOG_VISUAL_CAPTURE_FAILED');process.exitCode=1;});", "run().catch(e=>{const m=String(e?.message||'');console.log('MOG_VISUAL_FAILURE '+(/^[A-Z0-9_]+$/.test(m)?m:'OPERATION_FAILED'));process.exitCode=1;});")
          p.write_text(s)
          PY
          node --check tools/mog-qa-visual-private.mjs
      - name: Capture approved read-only views and encrypt evidence
        env:
          QA_GITHUB_TOKEN: ${{ github.token }}
        run: node tools/mog-qa-visual-private.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mog-qa-encrypted-visual
          path: mog-qa-encrypted/
          retention-days: 1
          if-no-files-found: warn
