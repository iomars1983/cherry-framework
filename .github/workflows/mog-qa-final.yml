name: MOG transactions and access QA - free runner
on:
  push:
    branches:
      - mog-qa-public-20261029
    paths:
      - tools/mog-qa-final.mjs
      - .github/workflows/mog-qa-final.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mog-final-transactions
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright on free standard runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test isolated guest WooCommerce flows (never place orders)
        run: node tools/mog-qa-final.mjs
      - name: Preserve sanitized report on isolated branch
        if: always()
        shell: bash
        run: |
          if [ -f mog-qa-final/transactions.json ]; then
            git config user.name "MOG QA Bot"
            git config user.email "mog-qa-bot@users.noreply.github.com"
            git add -f mog-qa-final/transactions.json
            if ! git diff --cached --quiet; then
              git commit -m "Save isolated Woo transactional QA result"
              git fetch origin mog-qa-public-20261029
              git rebase origin/mog-qa-public-20261029
              git push origin HEAD:mog-qa-public-20261029
            fi
          fi
